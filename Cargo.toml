
[package]
name = "telegram-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
teloxide = "=0.9.2"
pretty_env_logger = "0.4"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"

axum = "=0.8.9"
rand = "0.8.5"
sha2 = "0.10.9"
